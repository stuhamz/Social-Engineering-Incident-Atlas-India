name: Validate and deploy public Atlas index

on:
  push:
    branches: [main]
    paths:
      - "atlas/**"
      - "data/cases.csv"
      - "data/actors.csv"
      - "references/sources.csv"
      - "cases/**"
      - "analysis/scripts/build_public_atlas.py"
      - ".github/workflows/deploy-atlas.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate research files
        run: |
          python analysis/scripts/validate_dataset.py
          python analysis/scripts/validate_actors.py
          python analysis/scripts/validate_full_audit.py
      - name: Build privacy-minimized index
        run: python analysis/scripts/build_public_atlas.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: atlas
      - name: Deploy
        uses: actions/deploy-pages@v4
        id: deployment
